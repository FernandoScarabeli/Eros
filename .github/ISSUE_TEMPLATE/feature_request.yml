name: Feature request
description: Explain a user problem and a possible improvement.
title: "[Feature] "
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Include the workflow, alternatives and relevant constraints.
    validations:
      required: true
