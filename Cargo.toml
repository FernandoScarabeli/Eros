[workspace]
resolver = "2"
members = ["crates/eros-core", "crates/eros-service", "apps/desktop/src-tauri"]
default-members = ["crates/eros-core", "crates/eros-service"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
license = "Apache-2.0"

[workspace.dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
uuid = { version = "=1.18.1", features = ["v7", "serde"] }
ts-rs = { version = "=11.1.0", features = ["serde-json-impl"] }
libc = "=0.2.177"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
